<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Deep Dive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">🇮🇳 India Explorer</a>
        <div class="nav-links">
            <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
        </div>
    </nav>

    <main class="details-container fade-in">
        <a href="index.html" class="back-btn">← Back to Interactive Map</a>
        <div id="content"></div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const stateId = urlParams.get('id');
        
        setTimeout(() => {
            const data = typeof statesData !== 'undefined' ? statesData[stateId] : null;
            const contentDiv = document.getElementById('content');

            if (data && data.history) {
                contentDiv.innerHTML = `
                    <h1 style="font-size: 3rem; margin-bottom: 2rem;">${data.name}</h1>
                    
                    <h3>📜 Rich History</h3>
                    <p>${data.history}</p>
                    
                    <h3>✨ Regional Specialties</h3>
                    <p>${data.specialties}</p>
                    
                    <h3>🎭 Cultural Traditions</h3>
                    <p>${data.traditions}</p>
                    
                    <h3>👗 Traditional Clothing</h3>
                    <p>${data.clothing}</p>
                `;
            } else {
                contentDiv.innerHTML = `<h1>Data Missing</h1><p>Deep dive info for this state hasn't been mapped yet.</p>`;
            }
        }, 50);
    </script>
</body>
</html>
